# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes to main (and version-1.0.0, the previous deploy branch)
  push:
    branches: ["main", "version-1.0.0"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # llms.txt / about.md / resume.json are generated from index.html so they never drift from the page.
      # continue-on-error: a markup change that confuses the generator must not block a deploy —
      # the committed copies are published instead.
      - name: Regenerate AI-readable files
        run: python3 tools/build_ai_files.py
        continue-on-error: true
      # Stamp CSS/JS URLs with a content hash so a deploy can never pair new HTML with stale cached code.
      - name: Cache-bust CSS and JS
        run: python3 tools/stamp_assets.py
        continue-on-error: true
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
